
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Hostel Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #1f2937;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-top: 16px;
            padding: 11px;
            border-radius: 7px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        .success {
            margin-top: 16px;
            padding: 11px;
            border-radius: 7px;
            background: #ecfdf5;
            color: #047857;
            font-size: 14px;
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Student Login</h1>
        <p class="subtitle">Hostel Management System</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="success" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Gmail Address</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email|default('') }}"
                placeholder="Enter your registered Gmail"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>
    </main>
</body>
</html>
